name: backhome

services:
  web:
    build: .
    container_name: backhome-web
    env_file:
      - path: .env
        required: false
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

  # สร้าง .env จาก .env.enc แล้วเลือกเปิดเว็บต่อได้ โดยไม่ต้องมี Node/npm ในเครื่อง:
  #   docker compose run --rm setup
  setup:
    build:
      context: .
      dockerfile: scripts/setup.Dockerfile
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WEB_PORT=${WEB_PORT:-3000}
    stdin_open: true
    tty: true
    command: node scripts/setup.mjs
