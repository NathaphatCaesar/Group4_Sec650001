spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

server.port=${PORT:8080}

supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_ROLE_KEY}

tu.api.base=${TU_API_BASE:https://restapi.tu.ac.th/api/v1}
tu.api.key=${TU_API_KEY}
tu.path.verify=${TU_PATH_VERIFY:/auth/Ad/verify}
tu.path.student-info=${TU_PATH_STUDENT_INFO:/profile/std/info}
tu.path.faculty=${TU_PATH_FACULTY:/common/faculty}

session.secret=${SESSION_SECRET}
session.max-age-days=${SESSION_MAX_AGE_DAYS:90}

frontend.url=${FRONTEND_URL:http://127.0.0.1:5500}

session.cookie-secure=${SESSION_COOKIE_SECURE:false}
